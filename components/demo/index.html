<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>ds-chat demo | Downshift</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<script src="/components/ds-chat.js" defer></script>
</head>
<body>
<main>
<h1>&lt;ds-chat&gt; demo</h1>
<p>Placeholder content. The first scenario plays when the window enters the viewport; pick a tab or use Replay.</p>
<ds-chat>
<script type="application/json">
{
  "title": "Agent session",
  "caption": "Placeholder scenarios showing every row type.",
  "scenarios": [
    {"label": "Rename", "tokens": "~2k", "compactor": "",
     "agents": [{"title": "Rename the loader", "from": "opus", "to": "haiku"}, {"title": "Review the change", "from": "opus", "note": "held"}],
     "messages": [
      {"role": "user", "text": "Rename the config loader and update its callers."},
      {"role": "agent", "text": "One helper for the rename, one for the review."},
      {"role": "tool", "kind": "Agent", "text": "Rename the loader", "detail": "helper -> small model (placeholder)", "agent": 0, "time": "3s"},
      {"role": "tool", "kind": "Agent", "text": "Review the change", "detail": "kept on the requested model (placeholder)", "agent": 1, "time": "5s"},
      {"role": "agent", "text": "Done."}]},
    {"label": "Search", "tokens": "~1k", "compactor": "120 → 40 B", "agents": [],
     "messages": [
      {"role": "user", "text": "Find the callers."},
      {"role": "tool", "kind": "Bash", "text": "grep -rn loadConfig ./src ./internal ./cmd/example/with/a/very/long/path.go", "detail": "src/config.ts:12\nsrc/app.ts:40", "compact": true, "time": "1s"},
      {"role": "agent", "text": "Two callers."}]}
  ]
}
</script>
<ol>
<li data-role="user">Rename the config loader and update its callers.</li>
<li data-role="agent">One helper for the rename, one for the review.</li>
</ol>
</ds-chat>
<h2>v1 block (backward compatible)</h2>
<ds-chat>
<script type="application/json">
{"title": "session.chat", "messages": [
  {"role": "user", "text": "Rename the loader."},
  {"role": "tool", "text": "$ grep -rn loadConfig ./src\nsrc/config.ts:12"},
  {"role": "downshift", "text": "helper -> small model (placeholder)"}
]}
</script>
</ds-chat>
</main>
</body>
</html>
