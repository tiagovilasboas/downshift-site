<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>Doubt never spends money: unsure spawns keep the model they asked for</title><desc>Doubt never spends money: unsure spawns keep the model they asked for</desc>
<defs><radialGradient id="g" cx="82%" cy="100%" r="70%"><stop offset="0" stop-color="#22C55E" stop-opacity=".22"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
<pattern id="p" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern></defs>
<rect width="1200" height="630" fill="#000"/><rect width="1200" height="630" fill="url(#p)"/><rect width="1200" height="630" fill="url(#g)"/>
<text x="72" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#22C55E">FAIL-OPEN BY DESIGN</text>
<g transform="translate(1086 50) scale(.21)"><path d="M28 22 H104 L168 86 V140 L137 171 V98 L94 55 H28 Z" fill="#F9FAFB"/><path d="M28 80 H81 L120 119 V164 L94 190 V130 L74 110 H28 Z" fill="#F9FAFB"/><path d="M28 138 H65 L103 176 L78 201 L55 178 H28 Z" fill="#22C55E"/></g>
<text x="72" y="190" font-size="76" font-weight="800" letter-spacing="-2" fill="#F5F7FA">Doubt never</text>
<text x="72" y="272" font-size="76" font-weight="800" letter-spacing="-2" fill="#22C55E">spends money.</text>
<text x="72" y="338" font-size="25" fill="#9AA6B6">When the classifier is not confident, the spawn keeps the model it asked for.</text><text x="72" y="372" font-size="25" fill="#9AA6B6">Any error or missing capability leaves it untouched.</text>
<rect x="72" y="430" width="260" height="100" rx="12" fill="#0a0f16" stroke="#2a3340" stroke-width="1.5"/><text x="92" y="476.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" fill="#F5F7FA">spawn asks for</text><text x="92" y="504.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#9AA6B6">opus</text><path d="M340 480H412" stroke="#22C55E" stroke-width="3" fill="none"/><path d="M408 473L420 480L408 487Z" fill="#22C55E"/><path d="M560 420L690 480L560 540L430 480Z" fill="#0a0f16" stroke="#3a4350" stroke-width="1.5"/><text x="560" y="486" text-anchor="middle" font-size="17" font-weight="600" fill="#F5F7FA">classifier confident?</text><path d="M560 420V400H800" stroke="#9AA6B6" stroke-width="2.5" fill="none"/><path d="M780 400H852" stroke="#9AA6B6" stroke-width="3" fill="none"/><path d="M848 393L860 400L848 407Z" fill="#9AA6B6"/><rect x="866" y="370" width="262" height="60" rx="12" fill="#0a0f16" stroke="#2a3340" stroke-width="1.5"/><text x="886" y="408.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" fill="#9AA6B6">yes: rewrite</text><path d="M560 540V560H800" stroke="#22C55E" stroke-width="3" fill="none"/><path d="M780 560H852" stroke="#22C55E" stroke-width="3" fill="none"/><path d="M848 553L860 560L848 567Z" fill="#22C55E"/><rect x="866" y="530" width="262" height="60" rx="12" fill="#0a0f16" stroke="#22C55E" stroke-width="1.5"/><text x="886" y="568.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" fill="#22C55E">no: keeps opus</text>
</svg>